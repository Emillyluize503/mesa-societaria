<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<title>Mesa Societária</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior com abas, filtros em linha, depois quadro Kanban, lista ou painel de indicadores. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#e8edf4; --ink:#152033; --muted:#5a687c; --line:#d7dee9;
  --accent:#23529f; --accent-ink:#ffffff;
  --ok:#1b7a43; --ok-bg:#ddf1e5; --warn:#7d5200; --warn-bg:#fbebbf; --bad:#a82820; --bad-bg:#fadad6;
  --info:#23529f; --info-bg:#dde7f7; --neutral:#4b5565; --neutral-bg:#e5e8ee;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --surface:#172131; --surface2:#212c3e; --ink:#e5eaf2; --muted:#94a2b6; --line:#2b3749;
    --accent:#86abee; --accent-ink:#0e1420;
    --ok:#74d3a0; --ok-bg:#16382a; --warn:#f0c35f; --warn-bg:#3a2e10; --bad:#ff8f85; --bad-bg:#44201d;
    --info:#9fbdf3; --info-bg:#1c2c4b; --neutral:#aab4c4; --neutral-bg:#283244; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#172131; --surface2:#212c3e; --ink:#e5eaf2; --muted:#94a2b6; --line:#2b3749;
  --accent:#86abee; --accent-ink:#0e1420;
  --ok:#74d3a0; --ok-bg:#16382a; --warn:#f0c35f; --warn-bg:#3a2e10; --bad:#ff8f85; --bad-bg:#44201d;
  --info:#9fbdf3; --info-bg:#1c2c4b; --neutral:#aab4c4; --neutral-bg:#283244; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 12px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px;max-width:340px}
.filters select{flex:0 1 190px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:13px}
.banner[hidden]{display:none}
/* Quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface2);border-radius:10px;padding:10px;min-width:0;min-height:140px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;font-weight:600}
.col h3 b{font-family:var(--mono);font-weight:500}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.client{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--neutral-bg);color:var(--neutral);white-space:nowrap}
.tag.Urgente{background:var(--bad-bg);color:var(--bad)}
.tag.Alta{background:var(--warn-bg);color:var(--warn)}
.who{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--muted)}
.av{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink);flex:none}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.late-done{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.cancel{background:var(--neutral-bg);color:var(--neutral)}
.empty-col{color:var(--muted);font-size:12.5px;padding:10px 4px}
/* Lista */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
/* Painel */
.dash{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpis{grid-column:1/-1;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:12.5px}
.kpi strong{font-family:var(--mono);font-weight:500;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.kpi.bad strong{color:var(--bad)} .kpi.warn strong{color:var(--warn)} .kpi.ok strong{color:var(--ok)}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:1/-1}
@media(max-width:980px){.span4,.span5,.span6,.span7,.span8{grid-column:1/-1}}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .n{font-family:var(--mono);text-align:right}
.bar span:first-child{overflow-wrap:anywhere}
.f-info{background:var(--accent)}.f-bad{background:var(--bad)}.f-warn{background:#d79a1c}.f-ok{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.att{display:flex;flex-direction:column}
.att button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.att button:last-child{border-bottom:0}
.att button:hover .client{text-decoration:underline}
/* Vazio */
.hero{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;max-width:620px;margin:30px auto}
.hero h2{margin:0 0 6px;font-size:18px}
.hero p{margin:0 0 16px;color:var(--muted)}
.hero .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* Diálogo */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,12,20,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:16px}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;overflow-y:auto;max-height:calc(100dvh - 160px)}
.dlg-b .full{grid-column:1/-1}
@media(max-width:520px){.dlg-b{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label input,label select,label textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);font-size:14px;min-width:0}
textarea{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.dlg-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.dlg-f .sp{margin-right:auto}
.x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s}}
.auth-screen{max-width:420px;margin:9vh auto;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(20,35,55,.08)}.auth-screen h2{margin:0 0 6px}.auth-screen p{color:var(--muted);margin:0 0 18px}.auth-screen label{display:block;font-weight:500;margin:12px 0 5px}.auth-screen input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.auth-screen button{margin-top:16px;width:100%}.auth-error{color:var(--bad);font-size:13px;margin-top:10px}.top-actions{display:flex;gap:8px;align-items:center}
</style>

<section class="auth-screen" id="authScreen">
  <h2>Mesa Societária</h2><p>Acesse com seu e-mail e senha autorizados pela administração.</p>
  <form id="loginForm"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required><button class="btn primary" id="loginBtn" type="submit">Entrar</button><div class="auth-error" id="authError" role="alert"></div></form>
</section>

<div class="wrap" id="appShell" hidden>
  <header class="top">
    <div class="brand"><h1>Mesa Societária</h1><span>Demandas, prazos e entregas do setor</span></div>
    <nav class="tabs" role="tablist" aria-label="Visões">
      <button role="tab" data-view="quadro" aria-selected="true">Quadro</button>
      <button role="tab" data-view="lista" aria-selected="false">Lista</button>
      <button role="tab" data-view="painel" aria-selected="false">Painel</button>
    </nav>
    <div class="top-actions"><button class="btn" id="btnCfg" type="button">Configurar</button>
    <button class="btn primary" id="btnNew" type="button">+ Nova demanda</button><button class="btn" id="btnLogout" type="button">Sair</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="filters">
    <input id="fBusca" type="search" placeholder="Buscar cliente, protocolo ou descrição" aria-label="Buscar">
    <select id="fResp" aria-label="Responsável"></select>
    <select id="fTipo" aria-label="Tipo de serviço"></select>
    <select id="fSit" aria-label="Situação">
      <option value="">Todas as situações</option>
      <option value="bad">Atrasadas</option>
      <option value="warn">Vencem em até 2 dias</option>
      <option value="info">No prazo</option>
      <option value="ok">Entregues no prazo</option>
      <option value="late-done">Entregues com atraso</option>
    </select>
  </div>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="frm" autocomplete="off">
    <div class="dlg-h"><h2 id="dlgTitle">Nova demanda</h2><button class="x" type="button" id="dlgX" aria-label="Fechar">×</button></div>
    <div class="dlg-b">
      <label class="full">Cliente / empresa<input id="mCliente" required maxlength="120"></label>
      <label>Tipo de serviço<select id="mTipo"></select></label>
      <label>Responsável<select id="mResp"></select></label>
      <label class="full">Descrição ou nº do protocolo<input id="mDesc" maxlength="200" placeholder="Ex.: Protocolo JUCEMG 123456/26, entrada de sócio"></label>
      <label>Prioridade<select id="mPrio"></select></label>
      <label>Status<select id="mStatus"></select></label>
      <label>Data de abertura<input id="mAbertura" type="date" required></label>
      <label>Prazo limite<input id="mPrazo" type="date"><span class="hint" id="mPrazoHint"></span></label>
      <label id="mConclWrap" hidden>Data de conclusão<input id="mConcl" type="date"></label>
      <label class="full">Observações<textarea id="mObs" maxlength="1000"></textarea></label>
    </div>
    <div class="dlg-f">
      <button class="btn danger small" type="button" id="mDel" hidden>Excluir</button>
      <span class="sp"></span>
      <button class="btn" type="button" id="mCancel">Cancelar</button>
      <button class="btn primary" type="submit" id="mSave">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCfg">
  <form method="dialog" id="frmCfg">
    <div class="dlg-h"><h2>Configurar o setor</h2><button class="x" type="button" id="cfgX" aria-label="Fechar">×</button></div>
    <div class="dlg-b">
      <label class="full">Tipos de serviço e prazo (SLA) em dias úteis
        <textarea id="cTipos" rows="9" style="font-family:var(--mono);font-size:13px"></textarea>
        <span class="hint">Uma linha por tipo, no formato: Nome | dias. Sábados e domingos não contam; feriados não são descontados.</span></label>
      <label class="full">Responsáveis (um nome por linha)<textarea id="cResp" rows="5"></textarea></label>
      <div class="full" id="cExemplos" hidden><button class="btn small danger" type="button" id="btnRmEx">Remover demandas de exemplo</button></div>
    </div>
    <div class="dlg-f"><span class="sp"></span><button class="btn" type="button" id="cCancel">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var STATUS=["Não iniciado","Em andamento","Aguardando cliente","Aguardando órgão","Concluído","Cancelado"];
var COLS=STATUS.slice(0,5);
var PRIO=["Urgente","Alta","Média","Baixa"];
var DEF_CFG={
  tipos:[{nome:"Abertura de empresa",sla:10},{nome:"Alteração contratual",sla:7},{nome:"Baixa / Distrato",sla:10},
    {nome:"Alteração de endereço",sla:5},{nome:"Alteração de CNAE / atividade",sla:5},{nome:"Renovação de alvará / licença",sla:5},
    {nome:"Certidões e negativas",sla:2},{nome:"Ata / Deliberação de sócios",sla:5},{nome:"Atualização cadastral (Receita / QSA)",sla:3},
    {nome:"Transformação / Fusão / Cisão",sla:20},{nome:"Outros",sla:5}],
  responsaveis:["Analista 1","Analista 2","Analista 3","Analista 4"]
};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return ymd(new Date())}
function utc(s){var p=s.split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function diff(a,b){return Math.round((utc(b)-utc(a))/864e5)}
function addDays(s,n){var d=new Date(utc(s)+n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function addWork(s,n){var t=utc(s),c=0;while(c<n){t+=864e5;var w=new Date(t).getUTCDay();if(w!==0&&w!==6)c++}var d=new Date(t);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function fmt(s,short){if(!s)return "—";var p=s.split("-");return short?p[2]+"/"+p[1]:p[2]+"/"+p[1]+"/"+p[0]}
function fmtFull(s){if(!s)return "—";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function initials(n){var p=String(n||"").trim().split(/\s+/);if(!p[0])return "?";return (p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function isOpen(d){return d.status!=="Concluído"&&d.status!=="Cancelado"}
function sit(d){
  if(d.status==="Cancelado")return {k:"cancel",t:"Cancelado"};
  if(d.status==="Concluído"||d.conclusao){var c=d.conclusao||today();if(!d.prazo||c<=d.prazo)return {k:"ok",t:"Entregue no prazo"};return {k:"late-done",t:"Entregue com atraso"}}
  if(!d.prazo)return {k:"info",t:"Sem prazo"};
  var n=diff(today(),d.prazo);
  if(n<0)return {k:"bad",t:"Atrasado "+(-n)+"d",n:n};
  if(n<=2)return {k:"warn",t:n===0?"Vence hoje":"Vence em "+n+"d",n:n};
  return {k:"info",t:"No prazo · "+n+"d",n:n};
}
function codigo(d){return "SOC-"+String(d.seq||0).padStart(4,"0")}

/* ---------- estado ---------- */
var db=null,canWrite=true,loaded=false,local=false,authUser=null,realtimeChannel=null;
// Configure estes dois valores no painel do Supabase antes de publicar.
var SUPABASE_URL="COLE_AQUI_A_URL_DO_PROJETO";
var SUPABASE_ANON_KEY="COLE_AQUI_A_CHAVE_PUBLICA_ANON";
var demandas=[],cfg=JSON.parse(JSON.stringify(DEF_CFG)),cfgSaved=false;
var view="quadro",editing=null,prazoManual=false,delArmed=false;
var VIEWS=["quadro","lista","painel"];

function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function banner(msg){var b=$("#banner");if(msg){b.textContent=msg;b.hidden=false}else b.hidden=true}

/* ---------- persistência Supabase ---------- */
function cleanDoc(d){var o={};["cliente","tipo","descricao","responsavel","prioridade","status","abertura","prazo","conclusao","obs","seq","criadoEm"].forEach(function(k){if(d[k]!==undefined)o[k]=d[k]});if(d.exemplo)o.exemplo=true;return o}
async function persist(id,d){
  if(!db||!authUser)throw new Error("Sessão não autenticada");
  var r=await db.from("demandas").upsert({id:id,data:cleanDoc(d)});if(r.error)throw r.error;
}
async function removeDoc(id){if(!db||!authUser)throw new Error("Sessão não autenticada");var r=await db.from("demandas").delete().eq("id",id);if(r.error)throw r.error}
function newId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function nextSeq(){return demandas.reduce(function(m,d){return Math.max(m,d.seq||0)},0)+1}
async function saveCfg(c){if(!db||!authUser)throw new Error("Sessão não autenticada");var r=await db.from("config").upsert({id:"main",data:{tipos:c.tipos,responsaveis:c.responsaveis}});if(r.error)throw r.error;cfgSaved=true}

/* ---------- filtros ---------- */
function slaOf(tipo){var t=cfg.tipos.find(function(x){return x.nome===tipo});return t?t.sla:null}
function fillSelects(){
  var r=$("#fResp"),t=$("#fTipo"),rv=r.value,tv=t.value;
  r.innerHTML='<option value="">Todos os responsáveis</option>'+allResp().map(function(n){return '<option>'+esc(n)+'</option>'}).join("");
  t.innerHTML='<option value="">Todos os tipos</option>'+allTipos().map(function(n){return '<option>'+esc(n)+'</option>'}).join("");
  r.value=rv;t.value=tv;
}
function allResp(){var s=cfg.responsaveis.slice();demandas.forEach(function(d){if(d.responsavel&&s.indexOf(d.responsavel)<0)s.push(d.responsavel)});return s}
function allTipos(){var s=cfg.tipos.map(function(t){return t.nome});demandas.forEach(function(d){if(d.tipo&&s.indexOf(d.tipo)<0)s.push(d.tipo)});return s}
function filtered(){
  var q=$("#fBusca").value.trim().toLowerCase(),r=$("#fResp").value,t=$("#fTipo").value,s=$("#fSit").value;
  return demandas.filter(function(d){
    if(r&&d.responsavel!==r)return false;
    if(t&&d.tipo!==t)return false;
    if(s&&sit(d).k!==s)return false;
    if(q&&(d.cliente+" "+(d.descricao||"")+" "+codigo(d)).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

/* ---------- renderização ---------- */
function render(){
  fillSelects();
  $("#btnNew").hidden=!canWrite;
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.view===view))});
  var m=$("#main");
  if(!loaded){m.innerHTML='<div class="hero"><h2>Carregando demandas…</h2><p>Buscando os dados compartilhados do setor.</p></div>';return}
  if(!demandas.length){
    m.innerHTML='<div class="hero"><h2>Nenhuma demanda cadastrada ainda</h2><p>Cadastre a primeira demanda do setor. O prazo é calculado pelo tipo de serviço e as telas se atualizam para todos.</p><div class="btns">'+
      (canWrite?'<button class="btn primary" data-act="new">+ Nova demanda</button><button class="btn" data-act="seed">Carregar exemplos para testar</button>':'<span class="sub">Peça a um editor para cadastrar as demandas.</span>')+'</div></div>';
    return;
  }
  var list=filtered();
  if(view==="quadro")m.innerHTML=boardHTML(list);
  else if(view==="lista")m.innerHTML=listHTML(list);
  else m.innerHTML=dashHTML(list);
  if(view==="quadro")wireBoard();
}
function cardHTML(d){
  var s=sit(d);
  return '<button class="card" type="button" data-id="'+esc(d.id)+'" draggable="'+(canWrite?"true":"false")+'">'+
    '<div class="row"><span class="id">'+esc(codigo(d))+'</span><span class="tag '+esc(d.prioridade)+'">'+esc(d.prioridade||"Média")+'</span></div>'+
    '<div class="client">'+esc(d.cliente)+'</div>'+
    '<div class="sub">'+esc(d.tipo||"")+(d.descricao?' · '+esc(d.descricao):'')+'</div>'+
    '<div class="row"><span class="who"><span class="av">'+esc(initials(d.responsavel))+'</span>'+esc(d.responsavel||"Sem responsável")+'</span>'+
    '<span class="chip '+s.k+'" title="Prazo: '+esc(fmtFull(d.prazo))+'">'+esc(s.t)+'</span></div></button>';
}
function boardHTML(list){
  var h='<div class="board">';
  COLS.forEach(function(st){
    var items=list.filter(function(d){return d.status===st});
    items.sort(function(a,b){return (a.prazo||"9999").localeCompare(b.prazo||"9999")});
    h+='<section class="col" data-status="'+esc(st)+'"><h3><span>'+esc(st)+'</span><b>'+items.length+'</b></h3><div class="cards">'+
      (items.length?items.map(cardHTML).join(""):'<div class="empty-col">Nada aqui.</div>')+'</div></section>';
  });
  return h+'</div>';
}
function listHTML(list){
  var items=list.slice().sort(function(a,b){
    var ao=isOpen(a),bo=isOpen(b);if(ao!==bo)return ao?-1:1;
    if(ao)return (a.prazo||"9999").localeCompare(b.prazo||"9999");
    return (b.conclusao||"").localeCompare(a.conclusao||"");
  });
  var h='<div class="tablebox"><table><thead><tr><th>ID</th><th>Cliente</th><th>Tipo</th><th>Responsável</th><th>Prioridade</th><th>Status</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>';
  if(!items.length)h+='<tr><td colspan="8" class="sub" style="padding:22px;text-align:center">Nenhuma demanda com esses filtros.</td></tr>';
  items.forEach(function(d){var s=sit(d);
    h+='<tr data-id="'+esc(d.id)+'" tabindex="0"><td class="mono">'+esc(codigo(d))+'</td><td><div class="client">'+esc(d.cliente)+'</div>'+(d.descricao?'<div class="sub">'+esc(d.descricao)+'</div>':'')+
      '</td><td>'+esc(d.tipo||"")+'</td><td>'+esc(d.responsavel||"—")+'</td><td><span class="tag '+esc(d.prioridade)+'">'+esc(d.prioridade||"")+'</span></td><td>'+esc(d.status)+
      '</td><td class="mono">'+esc(fmtFull(d.prazo))+'</td><td><span class="chip '+s.k+'">'+esc(s.t)+'</span></td></tr>';
  });
  return h+'</tbody></table></div>';
}
function dashHTML(list){
  var open=list.filter(isOpen),late=open.filter(function(d){return sit(d).k==="bad"}),soon=open.filter(function(d){return sit(d).k==="warn"});
  var done=list.filter(function(d){var k=sit(d).k;return k==="ok"||k==="late-done"}),ontime=done.filter(function(d){return sit(d).k==="ok"});
  var pct=done.length?Math.round(ontime.length/done.length*100)+"%":"—";
  var h='<div class="dash"><div class="kpis">'+
    '<div class="kpi"><small>Em aberto</small><strong>'+open.length+'</strong></div>'+
    '<div class="kpi bad"><small>Atrasadas</small><strong>'+late.length+'</strong></div>'+
    '<div class="kpi warn"><small>Vencem em até 2 dias</small><strong>'+soon.length+'</strong></div>'+
    '<div class="kpi ok"><small>Entregues no prazo</small><strong>'+pct+'</strong></div>'+
    '<div class="kpi"><small>Entregues no total</small><strong>'+done.length+'</strong></div></div>';
  /* atenção agora */
  var att=open.filter(function(d){var k=sit(d).k;return k==="bad"||k==="warn"}).sort(function(a,b){return (a.prazo||"").localeCompare(b.prazo||"")}).slice(0,8);
  h+='<div class="panel span5"><h2>Atenção agora</h2><div class="att">'+(att.length?att.map(function(d){var s=sit(d);
    return '<button type="button" data-id="'+esc(d.id)+'"><span><span class="client">'+esc(d.cliente)+'</span><br><span class="sub">'+esc(d.tipo||"")+' · '+esc(d.responsavel||"Sem responsável")+'</span></span><span class="chip '+s.k+'">'+esc(s.t)+'</span></button>'}).join(""):'<div class="sub">Nenhuma demanda atrasada ou perto do prazo.</div>')+'</div></div>';
  /* por status */
  var mx=Math.max.apply(null,STATUS.map(function(s){return list.filter(function(d){return d.status===s}).length}).concat([1]));
  h+='<div class="panel span7"><h2>Demandas por status</h2><div class="bars">'+STATUS.map(function(s){var n=list.filter(function(d){return d.status===s}).length;
    return '<div class="bar"><span>'+esc(s)+'</span><span class="t"><i class="f-info" style="width:'+(n/mx*100)+'%"></i></span><span class="n">'+n+'</span></div>'}).join("")+'</div></div>';
  /* por responsável */
  var rs=allResp().concat(list.some(function(d){return !d.responsavel})?[""]:[]);
  var rows=rs.map(function(r){var o=open.filter(function(d){return (d.responsavel||"")===r});
    return {r:r,tot:o.length,bad:o.filter(function(d){return sit(d).k==="bad"}).length,warn:o.filter(function(d){return sit(d).k==="warn"}).length}});
  var rm=Math.max.apply(null,rows.map(function(x){return x.tot}).concat([1]));
  h+='<div class="panel span6"><h2>Carga por responsável (em aberto)</h2><div class="bars">'+rows.map(function(x){var ok=x.tot-x.bad-x.warn;
    return '<div class="bar"><span>'+esc(x.r||"Sem responsável")+'</span><span class="t"><i class="f-bad" style="width:'+(x.bad/rm*100)+'%"></i><i class="f-warn" style="width:'+(x.warn/rm*100)+'%"></i><i class="f-info" style="width:'+(ok/rm*100)+'%"></i></span><span class="n">'+x.tot+'</span></div>'}).join("")+
    '</div><div class="legend"><span><i class="f-bad"></i>Atrasadas</span><span><i class="f-warn"></i>Vencem em até 2 dias</span><span><i class="f-info"></i>No prazo</span></div></div>';
  /* por tipo */
  var ts=allTipos().map(function(t){var a=list.filter(function(d){return d.tipo===t}),o=a.filter(isOpen);
    return {t:t,tot:a.length,open:o.length,bad:o.filter(function(d){return sit(d).k==="bad"}).length,sla:slaOf(t)}}).filter(function(x){return x.tot>0});
  h+='<div class="panel span6"><h2>Por tipo de serviço</h2><div class="tablebox" style="border:0"><table style="min-width:0"><thead><tr><th>Tipo</th><th>Total</th><th>Abertas</th><th>Atrasadas</th><th>SLA</th></tr></thead><tbody>'+
    (ts.length?ts.map(function(x){return '<tr style="cursor:default"><td>'+esc(x.t)+'</td><td class="mono">'+x.tot+'</td><td class="mono">'+x.open+'</td><td class="mono"'+(x.bad?' style="color:var(--bad);font-weight:600"':'')+'>'+x.bad+'</td><td class="mono">'+(x.sla==null?"—":x.sla+"d")+'</td></tr>'}).join(""):'<tr><td colspan="5" class="sub">Sem dados.</td></tr>')+
    '</tbody></table></div></div></div>';
  return h;
}

/* ---------- quadro: arrastar e soltar ---------- */
var dragId=null;
function wireBoard(){
  document.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("dragstart",function(e){dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
    c.addEventListener("dragend",function(){c.classList.remove("dragging");document.querySelectorAll(".col.over").forEach(function(x){x.classList.remove("over")})});
  });
  document.querySelectorAll(".col").forEach(function(col){
    col.addEventListener("dragover",function(e){if(!canWrite)return;e.preventDefault();col.classList.add("over")});
    col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("over")});
    col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");if(dragId&&canWrite)move(dragId,col.dataset.status);dragId=null});
  });
}
async function move(id,status){
  var d=demandas.find(function(x){return x.id===id});if(!d||d.status===status)return;
  var n=Object.assign({},d,{status:status});
  if(status==="Concluído"){if(!n.conclusao)n.conclusao=today()}else n.conclusao="";
  try{await persist(id,n);toast("Movida para “"+status+"”")}catch(e){toast("Não foi possível salvar. Tente de novo.")}
}

/* ---------- diálogo de demanda ---------- */
function opt(arr,sel){return arr.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join("")}
function updHint(){
  var sla=slaOf($("#mTipo").value);
  $("#mPrazoHint").textContent=sla==null?"Defina o prazo manualmente.":"Calculado: "+sla+" dias úteis após a abertura"+(prazoManual?" (ajustado por você)":"");
}
function autoPrazo(){
  if(prazoManual)return;
  var sla=slaOf($("#mTipo").value),ab=$("#mAbertura").value;
  if(sla!=null&&ab)$("#mPrazo").value=addWork(ab,sla);
  updHint();
}
function toggleConcl(){
  var c=$("#mStatus").value==="Concluído";$("#mConclWrap").hidden=!c;
  if(c&&!$("#mConcl").value)$("#mConcl").value=today();
}
function openDlg(id){
  var d=id?demandas.find(function(x){return x.id===id}):null;editing=d?d.id:null;delArmed=false;
  $("#dlgTitle").textContent=d?codigo(d)+" · "+d.cliente:"Nova demanda";
  var tipos=allTipos(),resp=allResp();
  $("#mTipo").innerHTML=opt(tipos,d?d.tipo:tipos[0]);
  $("#mResp").innerHTML='<option value="">Sem responsável</option>'+opt(resp,d?d.responsavel:"");
  $("#mPrio").innerHTML=opt(PRIO,d?d.prioridade:"Média");
  $("#mStatus").innerHTML=opt(STATUS,d?d.status:"Não iniciado");
  $("#mCliente").value=d?d.cliente:"";$("#mDesc").value=d?d.descricao||"":"";
  $("#mAbertura").value=d?d.abertura:today();$("#mObs").value=d?d.obs||"":"";
  $("#mConcl").value=d?d.conclusao||"":"";
  prazoManual=!!d;
  if(d)$("#mPrazo").value=d.prazo||"";else{$("#mPrazo").value="";autoPrazo()}
  updHint();toggleConcl();
  $("#mDel").hidden=!d||!canWrite;$("#mDel").textContent="Excluir";
  $("#mSave").hidden=!canWrite;
  document.querySelectorAll("#frm input,#frm select,#frm textarea").forEach(function(el){el.disabled=!canWrite});
  $("#dlg").showModal();
  if(canWrite&&!d)$("#mCliente").focus();
}
$("#mTipo").addEventListener("change",autoPrazo);
$("#mAbertura").addEventListener("change",autoPrazo);
$("#mPrazo").addEventListener("input",function(){prazoManual=true;updHint()});
$("#mStatus").addEventListener("change",toggleConcl);
$("#frm").addEventListener("submit",async function(e){
  e.preventDefault();if(!canWrite)return;
  var old=editing?demandas.find(function(x){return x.id===editing}):null;
  var d={cliente:$("#mCliente").value.trim(),tipo:$("#mTipo").value,descricao:$("#mDesc").value.trim(),responsavel:$("#mResp").value,
    prioridade:$("#mPrio").value,status:$("#mStatus").value,abertura:$("#mAbertura").value,prazo:$("#mPrazo").value,
    conclusao:$("#mStatus").value==="Concluído"?($("#mConcl").value||today()):"",obs:$("#mObs").value.trim(),
    seq:old?old.seq:nextSeq(),criadoEm:old?old.criadoEm:Date.now(),exemplo:old?!!old.exemplo:false};
  if(!d.cliente)return;
  var id=editing||newId();
  $("#mSave").disabled=true;
  try{await persist(id,d);$("#dlg").close();toast(old?"Demanda atualizada":"Demanda cadastrada")}
  catch(err){toast("Não foi possível salvar. Verifique a conexão e tente de novo.")}
  $("#mSave").disabled=false;
});
$("#mDel").addEventListener("click",async function(){
  if(!delArmed){delArmed=true;this.textContent="Confirmar exclusão";return}
  try{await removeDoc(editing);$("#dlg").close();toast("Demanda excluída")}catch(e){toast("Não foi possível excluir.")}
});
$("#mCancel").addEventListener("click",function(){$("#dlg").close()});
$("#dlgX").addEventListener("click",function(){$("#dlg").close()});

/* ---------- configuração ---------- */
function openCfg(){
  $("#cTipos").value=cfg.tipos.map(function(t){return t.nome+" | "+t.sla}).join("\n");
  $("#cResp").value=cfg.responsaveis.join("\n");
  $("#cExemplos").hidden=!demandas.some(function(d){return d.exemplo});
  document.querySelectorAll("#frmCfg textarea, #frmCfg button[type=submit]").forEach(function(el){el.disabled=!canWrite});
  $("#dlgCfg").showModal();
}
$("#frmCfg").addEventListener("submit",async function(e){
  e.preventDefault();if(!canWrite)return;
  var tipos=[];
  $("#cTipos").value.split("\n").forEach(function(l){
    var p=l.split("|"),n=p[0].trim(),s=parseInt((p[1]||"").trim(),10);
    if(n)tipos.push({nome:n,sla:isNaN(s)||s<0?5:s});
  });
  var resp=$("#cResp").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
  if(!tipos.length){toast("Informe ao menos um tipo de serviço.");return}
  try{await saveCfg({tipos:tipos,responsaveis:resp});$("#dlgCfg").close();toast("Configuração salva")}
  catch(err){toast("Não foi possível salvar a configuração.")}
});
$("#cCancel").addEventListener("click",function(){$("#dlgCfg").close()});
$("#cfgX").addEventListener("click",function(){$("#dlgCfg").close()});
$("#btnRmEx").addEventListener("click",async function(){
  var ex=demandas.filter(function(d){return d.exemplo});
  try{for(var i=0;i<ex.length;i++)await removeDoc(ex[i].id);$("#dlgCfg").close();toast("Exemplos removidos")}catch(e){toast("Não foi possível remover todos.")}
});

/* ---------- exemplos ---------- */
async function seed(){
  var t=today(),r=cfg.responsaveis,tp=cfg.tipos;
  function T(i){return tp[i%tp.length].nome}
  function R(i){return r.length?r[i%r.length]:""}
  var ex=[
    ["Empresa Alfa Ltda",0,"Protocolo JUCEMG 123456/26","Em andamento","Alta",-16,null],
    ["Beta Comércio ME",1,"Entrada de novo sócio","Concluído","Média",-12,-6],
    ["Gama Serviços S/S",2,"Distrato e baixa na Receita","Aguardando cliente","Média",-6,null],
    ["Delta Indústria Ltda",5,"Alvará de funcionamento 2027","Em andamento","Urgente",-4,null],
    ["Épsilon Consultoria",3,"Mudança de sede","Concluído","Baixa",-14,-3],
    ["Zeta Transportes Ltda",7,"Ata de aprovação de contas","Não iniciado","Média",-1,null],
    ["Ômega Alimentos Ltda",4,"Inclusão de atividade no CNAE","Aguardando órgão","Alta",-8,null],
    ["Sigma Engenharia EPP",6,"Certidões para licitação","Em andamento","Urgente",-2,null]
  ];
  var base=nextSeq();
  for(var i=0;i<ex.length;i++){
    var e=ex[i],ab=addDays(t,e[5]);while([0,6].indexOf(new Date(utc(ab)).getUTCDay())>=0)ab=addDays(ab,-1);
    var sla=tp[e[1]%tp.length].sla;
    var d={cliente:e[0],tipo:T(e[1]),descricao:e[2],responsavel:R(i),prioridade:e[4],status:e[3],abertura:ab,prazo:addWork(ab,sla),
      conclusao:e[6]==null?"":addDays(t,e[6]),obs:"",seq:base+i,criadoEm:Date.now()+i,exemplo:true};
    await persist(newId(),d);
  }
  toast("Exemplos carregados. Remova-os em Configurar quando quiser.");
}

/* ---------- inicialização / autenticação ---------- */
var supabaseClient=null;
function showApp(on){$("#authScreen").hidden=on;$("#appShell").hidden=!on}
function showAuthError(msg){$("#authError").textContent=msg||""}
async function loadSharedData(){
  loaded=false;demandas=[];cfg=JSON.parse(JSON.stringify(DEF_CFG));render();
  var q=await db.from("demandas").select("id,data").order("id");
  if(q.error)throw q.error;demandas=(q.data||[]).map(function(x){return Object.assign({},x.data||{},{id:x.id})});
  var c=await db.from("config").select("data").eq("id","main").maybeSingle();
  if(c.error)throw c.error;if(c.data&&c.data.data){var x=c.data.data;if(x.tipos&&x.tipos.length)cfg={tipos:x.tipos,responsaveis:x.responsaveis||[]}}
  loaded=true;banner("");render();
  if(realtimeChannel)db.removeChannel(realtimeChannel);
  realtimeChannel=db.channel("mesa-societaria-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"demandas"},async function(){var z=await db.from("demandas").select("id,data");if(!z.error){demandas=(z.data||[]).map(function(x){return Object.assign({},x.data||{},{id:x.id})});render()}})
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},async function(){var z=await db.from("config").select("data").eq("id","main").maybeSingle();if(!z.error&&z.data&&z.data.data){cfg=z.data.data;render()}}).subscribe();
}
async function onSignedIn(session){
  authUser=session.user;showApp(true);canWrite=true;
  try{await loadSharedData()}catch(e){loaded=true;banner("Falha ao carregar dados compartilhados. Verifique a configuração do banco e as permissões.");render();console.error(e)}
}
$("#loginForm").addEventListener("submit",async function(e){e.preventDefault();showAuthError("");var btn=$("#loginBtn");btn.disabled=true;btn.textContent="Entrando…";
  try{var r=await db.auth.signInWithPassword({email:$("#loginEmail").value.trim(),password:$("#loginPassword").value});if(r.error)throw r.error;await onSignedIn(r.data.session)}catch(err){showAuthError("Não foi possível entrar. Confira o e-mail, a senha e se o usuário foi cadastrado pela administração.")}finally{btn.disabled=false;btn.textContent="Entrar"}
});
$("#btnLogout").addEventListener("click",async function(){if(realtimeChannel){await db.removeChannel(realtimeChannel);realtimeChannel=null}await db.auth.signOut();authUser=null;demandas=[];loaded=false;showApp(false)});
showApp(false);
if(!window.supabase||!window.supabase.createClient){showAuthError("Não foi possível carregar a biblioteca de conexão. Verifique sua internet.")}
else if(SUPABASE_URL.indexOf("COLE_AQUI")===0||SUPABASE_ANON_KEY.indexOf("COLE_AQUI")===0){showAuthError("O aplicativo ainda precisa ser conectado ao seu projeto Supabase. Siga o arquivo de instalação.")}
else{
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);db=supabaseClient;
